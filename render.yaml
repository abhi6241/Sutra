services:
  - type: web
    name: sutra-backend
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-startup.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUTRA_CORS_ORIGINS
        value: "http://localhost:5173"
      - key: GRAPH_LEG_TIMEOUT_S
        value: "60"
      - key: OLLAMA_DISABLE
        value: "1"
    disk:
      name: sutra-data
      mountPath: /app/data
      sizeGB: 1
